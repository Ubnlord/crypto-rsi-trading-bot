name: Demo Safety Tests

on:
  pull_request:
    branches:
      - upgrade/rsi-backtesting
  push:
    branches:
      - upgrade/bybit-mt5-demo-risk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install ccxt pandas python-dotenv numpy ta
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit tests
        env:
          MODE: paper
          EXCHANGE_ID: bybit
          RISK_PER_TRADE_PCT: "0.25"
        run: python -m unittest discover -s tests -v
