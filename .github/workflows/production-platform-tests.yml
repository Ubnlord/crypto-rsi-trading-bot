name: Production Platform Tests

on:
  pull_request:
    branches:
      - upgrade/rsi-backtesting
  push:
    branches:
      - product/production-trading-platform
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-service.txt ccxt pandas python-dotenv numpy ta
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit, API, and SaaS schema contract tests
        env:
          MODE: paper
          EXCHANGE_ID: bybit
          RISK_PER_TRADE_PCT: "0.25"
        run: python -m unittest discover -s tests -v
