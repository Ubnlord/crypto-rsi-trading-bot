name: Production Platform Tests

on:
  pull_request:
    branches:
      - upgrade/rsi-backtesting
  push:
    branches:
      - product/production-trading-platform
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsi_isolation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsi_isolation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsi_isolation_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-service.txt ccxt pandas python-dotenv numpy ta
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit, API, schema contract, and PostgreSQL RLS isolation tests
        env:
          MODE: paper
          EXCHANGE_ID: bybit
          RISK_PER_TRADE_PCT: "0.25"
        run: python -m unittest discover -s tests -v
