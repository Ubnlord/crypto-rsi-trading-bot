services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODE: paper
      DATABASE_PATH: /app/data/trading_bot.sqlite3
    volumes:
      - bot-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,os; p=os.getenv('DATABASE_PATH','/app/data/trading_bot.sqlite3'); c=sqlite3.connect(p); c.execute('SELECT 1'); c.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  dashboard:
    build: .
    command: ["python", "dashboard.py"]
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/trading_bot.sqlite3
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8080
    volumes:
      - bot-data:/app/data:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      bot:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  bot-data:
